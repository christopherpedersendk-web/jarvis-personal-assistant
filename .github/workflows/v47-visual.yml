name: JARVIS v4.7 browser smoke

on:
  pull_request:
    branches:
      - feature/v4.6-cloud-operations
    paths:
      - 'jarvis-starter/**'
      - '.github/workflows/v47-visual.yml'

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline unit tests
        working-directory: jarvis-starter
        run: npm test
      - name: Install browser test dependency in CI only
        working-directory: jarvis-starter
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium in ephemeral runner
        working-directory: jarvis-starter
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile Command Center
        working-directory: jarvis-starter
        run: node scripts/visual-smoke.mjs
      - name: Preserve synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v47-ui-screenshots
          path: jarvis-starter/artifacts/v47-*.png
          retention-days: 14
          if-no-files-found: warn
