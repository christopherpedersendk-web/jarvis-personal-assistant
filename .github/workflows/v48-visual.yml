name: JARVIS v5 candidate regression and browser smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'jarvis-starter/**'
      - '.github/workflows/v48-visual.yml'

permissions:
  contents: read

jobs:
  local-semantic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact proposed code
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local inference runtime in ephemeral CI only
        working-directory: jarvis-starter
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1
      - name: Verify and prepare immutable public model assets
        working-directory: jarvis-starter
        run: node scripts/prepare-local-semantic-model.mjs --directory "$RUNNER_TEMP/jarvis-e5-small" --accept-public-download
      - name: Measure genuine Danish semantic retrieval on fixed synthetic questions
        working-directory: jarvis-starter
        run: node scripts/v5-semantic-eval.mjs --model-directory "$RUNNER_TEMP/jarvis-e5-small" --output artifacts/v5-semantic-evaluation.json
      - name: Preserve candidate-bound synthetic model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v5-semantic-evaluation
          path: jarvis-starter/artifacts/v5-semantic-evaluation.json
          retention-days: 30
          if-no-files-found: warn
  visual-smoke:
    runs-on: ubuntu-24.04
    # Official Playwright test-only image ships WebKit system libraries.
    # Pin image and npm package together; run as non-root without privileged options.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 18
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline full regression and basket-approval tests
        working-directory: jarvis-starter
        run: npm test
      - name: Install browser test dependency in ephemeral CI only
        working-directory: jarvis-starter
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Verify Chromium and WebKit binaries in pinned CI image
        working-directory: jarvis-starter
        run: npx playwright install chromium webkit
      - name: Test desktop and mobile UI with synthetic data only (both engines)
        working-directory: jarvis-starter
        env:
          JARVIS_REQUIRE_WEBKIT: 'yes'
          JARVIS_V5_ARTIFACT_DIR: artifacts/v5-ui
        run: node scripts/v5-visual-smoke.mjs
      - name: Preserve synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v5-ui-screenshots
          path: jarvis-starter/artifacts/v5-ui/*.png
          retention-days: 14
          if-no-files-found: warn
